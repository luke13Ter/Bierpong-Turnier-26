<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 4h18l-3 26H10z' fill='%23cf2638'/%3E%3Crect x='6' y='3' width='20' height='4' rx='1' fill='%23e8e8e8'/%3E%3C/svg%3E">
<style>
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>Halloween-Bierpong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, sticky tab bar; rounds as stacked groups, each match a two-row card with a cup rack per team */
:root {
  --bg: #f2f3f7;
  --surface: #ffffff;
  --ink: #171a2c;
  --muted: #5e6479;
  --line: #dde0ea;
  --cup: #cf2638;
  --cup-soft: #fce4e7;
  --beer: #d9930f;
  --ok: #1d7f53;
  --ok-soft: #dff3e9;
  --warn: #a85b00;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #181c31; --ink: #eef0f8; --muted: #9ba1ba; --line: #2a3049;
    --cup: #ff5566; --cup-soft: #3b1924; --beer: #f3b53b; --ok: #45d095; --ok-soft: #13372a; --warn: #f0a542;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #181c31; --ink: #eef0f8; --muted: #9ba1ba; --line: #2a3049;
  --cup: #ff5566; --cup-soft: #3b1924; --beer: #f3b53b; --ok: #45d095; --ok-soft: #13372a; --warn: #f0a542;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
header.top { display: grid; gap: 4px; padding-bottom: 14px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 span { color: var(--cup); }
.rules { color: var(--muted); font-size: 13px; margin: 0; }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  background: var(--bg); padding-block: 8px;
}
nav.tabs button {
  font: 600 14px var(--body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 6px; cursor: pointer;
}
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cup); outline-offset: 2px; }

.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding-block: 6px 2px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cup); border-radius: 3px; transition: width .25s; }

.champ {
  margin-top: 14px; padding: 18px 16px; border-radius: 14px; background: var(--cup); color: #fff;
  display: grid; gap: 2px;
}
.champ small { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; opacity: .85; font-weight: 600; }
.champ strong { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; }

section.round { margin-top: 22px; display: grid; gap: 10px; }
.round-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.round-head h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
.now { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; background: var(--beer); color: #1a1200; padding: 3px 7px; border-radius: 6px; }
.bye { font-size: 13px; color: var(--muted); }
.bye b { color: var(--ink); font-weight: 600; }

.match { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 6px; }
.match.current { border-color: var(--beer); }
.match.final { border: 2px solid var(--cup); }
.match-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; letter-spacing: .06em; }
.chip.open { background: var(--bg); color: var(--muted); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--cup-soft); color: var(--cup); }

.side { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; }
.side.win { background: var(--cup-soft); }
.side .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.side.win .name::after { content: " · Sieg"; color: var(--cup); font-weight: 700; font-size: 13px; }
.side .pts { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }

.rack { display: grid; gap: 2px; justify-items: center; }
.rack div { display: flex; gap: 2px; }
.rack i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--line); }
.rack i.on { background: var(--cup); border-color: var(--cup); }

.step { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.step button {
  width: 38px; height: 38px; border: 0; background: var(--bg); color: var(--ink);
  font: 600 20px var(--body); cursor: pointer; line-height: 1;
}
.step button:disabled { opacity: .35; cursor: default; }
.step output { width: 30px; text-align: center; font-weight: 700; font-size: 17px; }
.hint { font-size: 13px; color: var(--cup); margin: 0; }
.locked { font-size: 13px; color: var(--muted); margin: 0; }

table { width: 100%; border-collapse: collapse; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
th, td { padding: 11px 8px; text-align: right; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
td:nth-child(2), th:nth-child(2) { text-align: left; }
td:first-child, th:first-child { width: 34px; text-align: center; }
tr:last-child td { border-bottom: 0; }
td.pts { font-weight: 700; font-size: 17px; }
tr.fin td:first-child { color: var(--cup); font-family: var(--display); }
tr.fin td:nth-child(2) { font-weight: 700; }
.note { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }

.panel { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input { font: 500 15px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 10px; font: 600 14px var(--body); border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn { padding: 12px; font: 600 14px var(--body); border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; width: 100%; }
.btn.danger { border-color: var(--cup); color: var(--cup); }
.btn.solid { background: var(--cup); color: #fff; border-color: var(--cup); }
.confirm { display: grid; gap: 8px; }
.confirm p { margin: 0; font-size: 13px; color: var(--warn); }
.confirm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Sa, 31. Oktober · 5 Teams · 2 Tische</div>
    <h1>Halloween-<span>Bierpong</span></h1>
    <p class="rules">Jeder gegen jeden, dann Finale der Top 2. Sieg = 10 Punkte, plus 1 Punkt pro übrigem Becher.</p>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tab-spiele" role="tab" data-tab="spiele">Spiele</button>
    <button id="tab-tabelle" role="tab" data-tab="tabelle">Tabelle</button>
    <button id="tab-setup" role="tab" data-tab="setup">Setup</button>
  </nav>
  <main id="app"></main>
</div>

<script>
const KEY = 'bierpong-2026-10-31';
const DEFAULT_TEAMS = ['Leni & Tobi', 'Vivien & Lukas', 'Paul', 'Diana & Lenny', 'Flo & Sandra'];
const RACKS = { 6: [3, 2, 1], 10: [4, 3, 2, 1] };

let ui = { tab: 'spiele', confirm: null };
let S = load() || fresh();

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function drawSchedule() {
  let slots = [...shuffle([0, 1, 2, 3, 4]), -1];
  const rounds = [];
  for (let r = 0; r < 5; r++) {
    const pairs = []; let bye = null;
    for (let i = 0; i < 3; i++) {
      const a = slots[i], b = slots[5 - i];
      if (a === -1) bye = b; else if (b === -1) bye = a;
      else pairs.push(Math.random() < .5 ? [a, b] : [b, a]);
    }
    rounds.push({ bye, matches: shuffle(pairs) });
    slots = [slots[0], slots[5], ...slots.slice(1, 5)];
  }
  return rounds;
}
function fresh(teams) { return { cups: 10, teams: teams || DEFAULT_TEAMS.slice(), rounds: drawSchedule(), scores: {}, final: [0, 0] }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.rounds ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function status(sc) {
  if (!sc || (sc[0] === 0 && sc[1] === 0)) return { st: 'open' };
  if (sc[0] > 0 && sc[1] > 0) return { st: 'bad' };
  return { st: 'done', w: sc[0] > 0 ? 0 : 1 };
}
function allMatches() {
  const out = [];
  S.rounds.forEach((r, ri) => r.matches.forEach((m, mi) => out.push({ key: ri + '-' + mi, a: m[0], b: m[1], ri })));
  return out;
}
function standings() {
  const t = S.teams.map((name, id) => ({ id, name, played: 0, wins: 0, cups: 0, pts: 0 }));
  const h2h = {};
  allMatches().forEach(m => {
    const sc = S.scores[m.key]; const s = status(sc);
    if (s.st !== 'done') return;
    const ids = [m.a, m.b];
    ids.forEach((id, i) => { t[id].played++; t[id].cups += sc[i]; t[id].pts += sc[i]; });
    const w = ids[s.w];
    t[w].wins++; t[w].pts += 10;
    h2h[m.a + '-' + m.b] = w; h2h[m.b + '-' + m.a] = w;
  });
  return t.sort((x, y) => y.pts - x.pts || y.wins - x.wins ||
    (h2h[x.id + '-' + y.id] === x.id ? -1 : h2h[x.id + '-' + y.id] === y.id ? 1 : 0) || y.cups - x.cups);
}
function doneCount() { return allMatches().filter(m => status(S.scores[m.key]).st === 'done').length; }

function rack(n) {
  const rows = RACKS[S.cups]; let k = 0;
  return '<span class="rack" aria-hidden="true">' + rows.map(len => '<div>' + Array.from({ length: len }, () => `<i class="${k++ < n ? 'on' : ''}"></i>`).join('') + '</div>').join('') + '</span>';
}
function sideHtml(key, side, teamName, val, win, disabled) {
  const pts = win ? 10 + val : val;
  const id = `s-${key}-${side}`;
  return `<div class="side ${win ? 'win' : ''}">
    <span class="name">${esc(teamName)}<span class="pts">${disabled ? '&nbsp;' : val + ' Becher übrig · ' + pts + ' Pkt'}</span></span>
    ${rack(val)}
    <span class="step">
      <button id="${id}-dec" data-k="${key}" data-s="${side}" data-d="-1" aria-label="${esc(teamName)}: ein Becher weniger" ${disabled || val <= 0 ? 'disabled' : ''}>−</button>
      <output>${val}</output>
      <button id="${id}-inc" data-k="${key}" data-s="${side}" data-d="1" aria-label="${esc(teamName)}: ein Becher mehr" ${disabled || val >= S.cups ? 'disabled' : ''}>+</button>
    </span>
  </div>`;
}
function matchHtml(key, a, b, label, opts = {}) {
  const sc = (key === 'F' ? S.final : S.scores[key]) || [0, 0];
  const s = status(sc);
  const chip = opts.disabled ? '<span class="chip open">noch offen</span>'
    : s.st === 'done' ? '<span class="chip done">fertig</span>'
    : s.st === 'bad' ? '<span class="chip bad">prüfen</span>' : '<span class="chip open">offen</span>';
  const nameA = a == null ? 'Platz 1' : S.teams[a], nameB = b == null ? 'Platz 2' : S.teams[b];
  return `<div class="match ${opts.cls || ''}">
    <div class="match-top"><span>${label}</span>${chip}</div>
    ${sideHtml(key, 0, nameA, sc[0], s.st === 'done' && s.w === 0, opts.disabled)}
    ${sideHtml(key, 1, nameB, sc[1], s.st === 'done' && s.w === 1, opts.disabled)}
    ${s.st === 'bad' ? '<p class="hint">Beim Verlierer müssen 0 Becher stehen.</p>' : ''}
    ${opts.note ? `<p class="locked">${opts.note}</p>` : ''}
  </div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function viewSpiele() {
  const done = doneCount();
  const curRound = S.rounds.findIndex((r, ri) => r.matches.some((m, mi) => status(S.scores[ri + '-' + mi]).st !== 'done'));
  const table = standings();
  const allDone = done === 10;
  const fs = status(S.final);
  let h = `<div class="progress"><span>${done} von 10 Gruppenspielen</span><span class="bar"><i style="width:${done * 10}%"></i></span></div>`;
  if (allDone && fs.st === 'done') {
    h += `<div class="champ"><small>Turniersieger</small><strong>${esc(S.teams[[table[0].id, table[1].id][fs.w]])}</strong></div>`;
  }
  S.rounds.forEach((r, ri) => {
    const isNow = ri === curRound;
    h += `<section class="round"><div class="round-head"><h2>Runde ${ri + 1}${isNow ? '<span class="now">Jetzt</span>' : ''}</h2>
      <span class="bye">Pause: <b>${esc(S.teams[r.bye])}</b></span></div>`;
    r.matches.forEach((m, mi) => { h += matchHtml(ri + '-' + mi, m[0], m[1], 'Tisch ' + (mi + 1), { cls: isNow ? 'current' : '' }); });
    h += '</section>';
  });
  h += `<section class="round"><div class="round-head"><h2>Finale${allDone && fs.st !== 'done' ? '<span class="now">Jetzt</span>' : ''}</h2></div>`;
  h += allDone
    ? matchHtml('F', table[0].id, table[1].id, 'Tisch 1', { cls: 'final' })
    : matchHtml('F', null, null, 'Tisch 1', { cls: 'final', disabled: true, note: `Stand jetzt: ${esc(table[0].name)} gegen ${esc(table[1].name)}. Steht nach allen Gruppenspielen fest.` });
  h += '</section>';
  return h;
}
function viewTabelle() {
  const t = standings();
  let h = `<table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>Becher</th><th>Pkt</th></tr></thead><tbody>`;
  t.forEach((r, i) => {
    h += `<tr class="${i < 2 ? 'fin' : ''}"><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.played}</td><td>${r.wins}</td><td>${r.cups}</td><td class="pts">${r.pts}</td></tr>`;
  });
  h += `</tbody></table><p class="note">Rot markiert: aktuell im Finale. Bei Punktgleichheit zählen erst die Siege, dann der direkte Vergleich, dann die übrigen Becher.</p>`;
  return h;
}
function viewSetup() {
  const c = ui.confirm;
  const confirmBox = (kind, text, btn) => c === kind
    ? `<div class="confirm"><p>${text}</p><div class="row"><button class="btn" id="c-no" data-act="cancel">Abbrechen</button><button class="btn solid" id="c-yes-${kind}" data-act="do-${kind}">${btn}</button></div></div>`
    : '';
  return `<div class="panel"><h3>Becher pro Team</h3>
      <div class="seg">${[6, 10].map(n => `<button id="cups-${n}" data-act="cups" data-n="${n}" aria-pressed="${S.cups === n}">${n} Becher</button>`).join('')}</div></div>
    <div class="panel"><h3>Teams</h3>
      ${S.teams.map((n, i) => `<div class="field"><label for="team-${i}">Team ${i + 1}</label><input id="team-${i}" data-team="${i}" value="${esc(n)}"></div>`).join('')}</div>
    <div class="panel"><h3>Spielplan</h3>
      ${c === 'redraw' ? confirmBox('redraw', 'Neue Auslosung löscht alle eingetragenen Ergebnisse.', 'Neu auslosen')
        : `<button class="btn" id="b-redraw" data-act="ask-redraw">Spielplan neu auslosen</button>`}
      ${c === 'reset' ? confirmBox('reset', 'Alle Ergebnisse inklusive Finale werden gelöscht. Der Spielplan bleibt.', 'Löschen')
        : `<button class="btn danger" id="b-reset" data-act="ask-reset">Ergebnisse löschen</button>`}
    </div>`;
}

function render() {
  const focusId = document.activeElement && document.activeElement.id;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === ui.tab));
  document.getElementById('app').innerHTML = ui.tab === 'spiele' ? viewSpiele() : ui.tab === 'tabelle' ? viewTabelle() : viewSetup();
  if (focusId) { const el = document.getElementById(focusId); if (el && !el.disabled) el.focus(); }
}

document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; ui.confirm = null; render();
});
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k) {
    const k = b.dataset.k, s = +b.dataset.s, d = +b.dataset.d;
    const sc = (k === 'F' ? S.final : S.scores[k]) || [0, 0];
    const next = sc.slice(); next[s] = Math.max(0, Math.min(S.cups, next[s] + d));
    // Ein Team auf >0 setzen, während das andere auch >0 hat, ist erlaubt (Hinweis erscheint), damit man korrigieren kann
    if (k === 'F') S.final = next; else S.scores[k] = next;
    save(); render(); return;
  }
  const act = b.dataset.act;
  if (act === 'cups') {
    S.cups = +b.dataset.n;
    Object.values(S.scores).forEach(sc => { sc[0] = Math.min(sc[0], S.cups); sc[1] = Math.min(sc[1], S.cups); });
    S.final = S.final.map(v => Math.min(v, S.cups));
  }
  if (act === 'ask-redraw') ui.confirm = 'redraw';
  if (act === 'ask-reset') ui.confirm = 'reset';
  if (act === 'cancel') ui.confirm = null;
  if (act === 'do-redraw') { S = { ...fresh(S.teams), cups: S.cups }; ui.confirm = null; ui.tab = 'spiele'; }
  if (act === 'do-reset') { S.scores = {}; S.final = [0, 0]; ui.confirm = null; ui.tab = 'spiele'; }
  save(); render();
});
document.getElementById('app').addEventListener('input', e => {
  const i = e.target.dataset.team; if (i == null) return;
  S.teams[+i] = e.target.value || ('Team ' + (+i + 1)); save();
});
save(); render();
</script>
</body>
</html>
