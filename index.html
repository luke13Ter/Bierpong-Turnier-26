<html lang="de">
<head>

<style>
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }

<title>Halloween-Bierpong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, sticky tab bar; rounds as stacked groups, each match a two-row card with a cup rack per team */
:root {
  --bg: #f2f3f7;
  --surface: #ffffff;
  --ink: #171a2c;
  --muted: #5e6479;
  --line: #dde0ea;
  --cup: #cf2638;
  --cup-soft: #fce4e7;
  --beer: #d9930f;
  --ok: #1d7f53;
  --ok-soft: #dff3e9;
  --warn: #a85b00;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #181c31; --ink: #eef0f8; --muted: #9ba1ba; --line: #2a3049;
    --cup: #ff5566; --cup-soft: #3b1924; --beer: #f3b53b; --ok: #45d095; --ok-soft: #13372a; --warn: #f0a542;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #181c31; --ink: #eef0f8; --muted: #9ba1ba; --line: #2a3049;
  --cup: #ff5566; --cup-soft: #3b1924; --beer: #f3b53b; --ok: #45d095; --ok-soft: #13372a; --warn: #f0a542;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
header.top { display: grid; gap: 4px; padding-bottom: 14px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 0; text-wrap: balance; }
h1 span { color: var(--cup); }
.rules { color: var(--muted); font-size: 13px; margin: 0; }
.headrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.sync { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .08em; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync.live { background: var(--ok-soft); color: var(--ok); }
.sync.offline { background: var(--cup-soft); color: var(--cup); }
.error { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--cup-soft); color: var(--cup); font-size: 13px; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  background: var(--bg); padding-block: 8px;
}
nav.tabs button {
  font: 600 14px var(--body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 6px; cursor: pointer;
}
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cup); outline-offset: 2px; }

.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding-block: 6px 2px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cup); border-radius: 3px; transition: width .25s; }

.champ {
  margin-top: 14px; padding: 18px 16px; border-radius: 14px; background: var(--cup); color: #fff;
  display: grid; gap: 2px;
}
.champ small { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; opacity: .85; font-weight: 600; }
.champ strong { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; }

section.round { margin-top: 22px; display: grid; gap: 10px; }
.round-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.round-head h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
.now { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .08em; background: var(--beer); color: #1a1200; padding: 3px 7px; border-radius: 6px; }
.bye { font-size: 13px; color: var(--muted); }
.bye b { color: var(--ink); font-weight: 600; }

.match { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; display: grid; gap: 6px; }
.match.current { border-color: var(--beer); }
.match.final { border: 2px solid var(--cup); }
.match-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; letter-spacing: .06em; }
.chip.open { background: var(--bg); color: var(--muted); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--cup-soft); color: var(--cup); }

.teams2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.team-btn {
  min-height: 52px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); font: 600 15px var(--body); cursor: pointer;
  overflow-wrap: anywhere; line-height: 1.2;
}
.team-btn:disabled { cursor: default; opacity: .6; }
.team-btn.win:disabled, .team-btn.lose:disabled { opacity: 1; }
.team-btn.win { background: var(--cup); border-color: var(--cup); color: #fff; }
.team-btn.lose { color: var(--muted); }
.team-btn.pick { border-color: var(--cup); color: var(--cup); background: var(--cup-soft); }
.ask { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
.ask b { color: var(--ink); }
.cups { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cups.c6 { grid-template-columns: repeat(6, 1fr); }
.cups button {
  height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  color: var(--ink); font: 700 17px var(--body); cursor: pointer;
}
.cups button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.result { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.result .sum { display: flex; align-items: center; gap: 10px; }
.result strong { color: var(--cup); }
.linkbtn { background: none; border: 0; padding: 6px 2px; font: 600 13px var(--body); color: var(--muted); text-decoration: underline; cursor: pointer; }
.rowend { display: flex; justify-content: space-between; gap: 10px; }
.hint { font-size: 13px; color: var(--cup); margin: 0; }
.locked { font-size: 13px; color: var(--muted); margin: 0; }

table { width: 100%; border-collapse: collapse; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
th, td { padding: 11px 8px; text-align: right; border-bottom: 1px solid var(--line); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
td:nth-child(2), th:nth-child(2) { text-align: left; }
td:first-child, th:first-child { width: 34px; text-align: center; }
tr:last-child td { border-bottom: 0; }
td.pts { font-weight: 700; font-size: 17px; }
tr.fin td:first-child { color: var(--cup); font-family: var(--display); }
tr.fin td:nth-child(2) { font-weight: 700; }
.note { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.share { margin-top: 16px; display: grid; gap: 12px; }
.shot { display: block; width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--line); }

.panel { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input { font: 500 15px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 10px; font: 600 14px var(--body); border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn { padding: 12px; font: 600 14px var(--body); border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; width: 100%; }
.btn.danger { border-color: var(--cup); color: var(--cup); }
.btn.solid { background: var(--cup); color: #fff; border-color: var(--cup); }
.confirm { display: grid; gap: 8px; }
.confirm p { margin: 0; font-size: 13px; color: var(--warn); }
.confirm .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="headrow"><div class="eyebrow">Sa, 31. Oktober · 5 Teams · 2 Tische</div><span id="sync" class="sync">Verbinde…</span></div>
    <h1>Halloween-<span>Bierpong</span></h1>
    <p class="rules">Jeder gegen jeden, dann Finale der Top 2. Sieg = 10 Punkte, plus 1 Punkt pro übrigem Becher.</p>
  </header>
  <nav class="tabs" role="tablist">
    <button id="tab-spiele" role="tab" data-tab="spiele">Spiele</button>
    <button id="tab-tabelle" role="tab" data-tab="tabelle">Tabelle</button>
    <button id="tab-endstand" role="tab" data-tab="endstand">Endstand</button>
    <button id="tab-setup" role="tab" data-tab="setup">Setup</button>
  </nav>
  <div id="err" class="error" hidden></div>
  <main id="app"><p class="loading">Lade Turnier…</p></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   FIREBASE-CONFIG HIER EINFÜGEN
   (Firebase-Konsole → Projekteinstellungen → Deine Apps → Web-App → "Config")
   Solange hier Platzhalter stehen, speichert die Seite nur lokal im Browser.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAC6xSvM7MNg_Bi9NLIiRK7ZgT_9BmXVQU",
  authDomain: "bierpong-26.firebaseapp.com",
  databaseURL: "https://bierpong-26-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bierpong-26",
  storageBucket: "bierpong-26.firebasestorage.app",
  messagingSenderId: "1005203388751",
  appId: "1:1005203388751:web:77336a03efa80f6c04ad3a"
};
const ROOT = 'turniere/bierpong-26-v2'; // frischer Speicherplatz, alte Daten bleiben unberührt
// Turnier abgeschlossen: Seite zeigt nur noch an, nichts wird geschrieben (passend zu den
// schreibgeschützten Datenbank-Regeln in database.rules.json). Für ein neues Turnier auf false setzen.
const LOCKED = true;
const CONFIGURED = !/HIER_EINFUEGEN/.test(FIREBASE_CONFIG.apiKey + FIREBASE_CONFIG.databaseURL);
const LOCAL = !CONFIGURED || typeof firebase === 'undefined';
let dbRef = null;

const KEY = 'bierpong-2026-10-31';
const DEFAULT_TEAMS = ['Leni & Tobi', 'Vivien & Lukas', 'Paul', 'Diana & Lenny', 'Flo & Sandra'];
const RACKS = { 6: [3, 2, 1], 10: [4, 3, 2, 1] };

let ui = { tab: LOCKED ? 'endstand' : 'spiele', confirm: null, pick: {} };
let S = null;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function drawSchedule() {
  let slots = [...shuffle([0, 1, 2, 3, 4]), -1];
  const rounds = [];
  for (let r = 0; r < 5; r++) {
    const pairs = []; let bye = null;
    for (let i = 0; i < 3; i++) {
      const a = slots[i], b = slots[5 - i];
      if (a === -1) bye = b; else if (b === -1) bye = a;
      else pairs.push(Math.random() < .5 ? [a, b] : [b, a]);
    }
    rounds.push({ bye, matches: shuffle(pairs) });
    slots = [slots[0], slots[5], ...slots.slice(1, 5)];
  }
  return rounds;
}
// Fester Spielplan, passend zur tatsächlich gespielten Runde 1.
// Teams: 0 Leni & Tobi, 1 Vivien & Lukas, 2 Paul, 3 Diana & Lenny, 4 Flo & Sandra
const SCHEDULE_ID = 'fest-1';
const FIXED_ROUNDS = [
  { bye: 4, matches: [[1, 2], [0, 3]] },
  { bye: 0, matches: [[1, 3], [2, 4]] },
  { bye: 1, matches: [[0, 4], [2, 3]] },
  { bye: 2, matches: [[0, 1], [3, 4]] },
  { bye: 3, matches: [[0, 2], [1, 4]] }
];
function fixedRounds() { return JSON.parse(JSON.stringify(FIXED_ROUNDS)); }
function fresh(teams) { return { cups: 10, teams: teams || DEFAULT_TEAMS.slice(), rounds: fixedRounds(), scheduleId: SCHEDULE_ID, scores: {}, final: [0, 0] }; }
// Alte, zufällig ausgeloste Pläne ohne Ergebnisse auf den festen Plan umstellen
function needsMigration(v) {
  if (v.scheduleId) return false;
  const anyResult = Object.values(v.scores || {}).some(x => x && (+x[0] > 0 || +x[1] > 0));
  return !anyResult;
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.rounds ? s : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function status(sc) {
  if (!sc || (sc[0] === 0 && sc[1] === 0)) return { st: 'open' };
  if (sc[0] > 0 && sc[1] > 0) return { st: 'bad' };
  return { st: 'done', w: sc[0] > 0 ? 0 : 1 };
}
function allMatches() {
  const out = [];
  S.rounds.forEach((r, ri) => r.matches.forEach((m, mi) => out.push({ key: ri + '-' + mi, a: m[0], b: m[1], ri })));
  return out;
}
function standings() {
  const t = S.teams.map((name, id) => ({ id, name, played: 0, wins: 0, cups: 0, pts: 0 }));
  const h2h = {};
  allMatches().forEach(m => {
    const sc = S.scores[m.key]; const s = status(sc);
    if (s.st !== 'done') return;
    const ids = [m.a, m.b];
    ids.forEach((id, i) => { t[id].played++; t[id].cups += sc[i]; t[id].pts += sc[i]; });
    const w = ids[s.w];
    t[w].wins++; t[w].pts += 10;
    h2h[m.a + '-' + m.b] = w; h2h[m.b + '-' + m.a] = w;
  });
  return t.sort((x, y) => y.pts - x.pts || y.wins - x.wins ||
    (h2h[x.id + '-' + y.id] === x.id ? -1 : h2h[x.id + '-' + y.id] === y.id ? 1 : 0) || y.cups - x.cups);
}
function doneCount() { return allMatches().filter(m => status(S.scores[m.key]).st === 'done').length; }
// Endstand: Finale getrennt von der Gruppenphase (das Finale zählt nicht in die Tabelle)
function finalResult() {
  const fs = status(S.final);
  if (doneCount() < 10 || fs.st !== 'done') return null;
  const table = standings();
  return { table, win: table[fs.w], lose: table[1 - fs.w], cups: S.final[fs.w] };
}

function rack(n) {
  const rows = RACKS[S.cups]; let k = 0;
  return '<span class="rack" aria-hidden="true">' + rows.map(len => '<div>' + Array.from({ length: len }, () => `<i class="${k++ < n ? 'on' : ''}"></i>`).join('') + '</div>').join('') + '</span>';
}
function matchHtml(key, a, b, label, opts = {}) {
  const sc = (key === 'F' ? S.final : S.scores[key]) || [0, 0];
  const s = status(sc);
  const pick = ui.pick[key];
  const ro = opts.disabled || LOCKED;
  const editing = pick !== undefined && !ro;
  const chip = opts.disabled ? '<span class="chip open">noch offen</span>'
    : s.st === 'done' ? '<span class="chip done">fertig</span>'
    : s.st === 'bad' ? '<span class="chip bad">prüfen</span>' : '<span class="chip open">offen</span>';
  const names = [a == null ? 'Platz 1' : S.teams[a], b == null ? 'Platz 2' : S.teams[b]];
  const winSide = editing ? pick : (s.st === 'done' ? s.w : null);
  const btn = i => {
    const cls = winSide === null ? '' : winSide === i ? (editing ? 'pick' : 'win') : 'lose';
    return `<button class="team-btn ${cls}" id="w-${key}-${i}" data-k="${key}" data-win="${i}" ${ro ? 'disabled' : ''}
      aria-pressed="${winSide === i}">${esc(names[i])}</button>`;
  };
  let body = '';
  if (editing) {
    const cur = s.st === 'done' && s.w === pick ? sc[pick] : 0;
    body = `<p class="ask">Wie viele Becher hatte <b>${esc(names[pick])}</b> noch übrig?</p>
      <div class="cups ${S.cups === 6 ? 'c6' : ''}">${Array.from({ length: S.cups }, (_, i) => i + 1).map(n =>
        `<button id="c-${key}-${n}" data-k="${key}" data-cups="${n}" class="${cur === n ? 'on' : ''}" aria-label="${n} Becher übrig">${n}</button>`).join('')}</div>
      <div class="rowend"><button class="linkbtn" id="x-${key}" data-k="${key}" data-act="cancel-pick">Abbrechen</button>
      ${s.st !== 'open' ? `<button class="linkbtn" id="d-${key}" data-k="${key}" data-act="clear">Ergebnis löschen</button>` : ''}</div>`;
  } else if (s.st === 'done') {
    const c = sc[s.w];
    body = `<div class="result"><span class="sum">${rack(c)}<span>${c} Becher übrig${key === 'F' ? '' : ` · <strong>+${10 + c} Pkt</strong>`}</span></span>
      ${ro ? '' : `<button class="linkbtn" id="e-${key}" data-k="${key}" data-act="edit">Ändern</button>`}</div>`;
  } else if (s.st === 'bad') {
    body = `<p class="hint">Unklares Ergebnis.${ro ? '' : ' Bitte Sieger neu antippen.'}</p>`;
  } else if (!ro) {
    body = `<p class="ask">Sieger antippen</p>`;
  }
  return `<div class="match ${opts.cls || ''}">
    <div class="match-top"><span>${label}</span>${chip}</div>
    <div class="teams2">${btn(0)}${btn(1)}</div>
    ${body}
    ${opts.note ? `<p class="locked">${opts.note}</p>` : ''}
  </div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function viewSpiele() {
  const done = doneCount();
  const curRound = S.rounds.findIndex((r, ri) => r.matches.some((m, mi) => status(S.scores[ri + '-' + mi]).st !== 'done'));
  const table = standings();
  const allDone = done === 10;
  const fs = status(S.final);
  let h = `<div class="progress"><span>${done} von 10 Gruppenspielen</span><span class="bar"><i style="width:${done * 10}%"></i></span></div>`;
  if (allDone && fs.st === 'done') {
    h += `<div class="champ"><small>Turniersieger</small><strong>${esc(S.teams[[table[0].id, table[1].id][fs.w]])}</strong></div>`;
  }
  S.rounds.forEach((r, ri) => {
    const isNow = ri === curRound;
    h += `<section class="round"><div class="round-head"><h2>Runde ${ri + 1}${isNow ? '<span class="now">Jetzt</span>' : ''}</h2>
      <span class="bye">Pause: <b>${esc(S.teams[r.bye])}</b></span></div>`;
    r.matches.forEach((m, mi) => { h += matchHtml(ri + '-' + mi, m[0], m[1], 'Tisch ' + (mi + 1), { cls: isNow ? 'current' : '' }); });
    h += '</section>';
  });
  h += `<section class="round"><div class="round-head"><h2>Finale${allDone && fs.st !== 'done' ? '<span class="now">Jetzt</span>' : ''}</h2></div>`;
  h += allDone
    ? matchHtml('F', table[0].id, table[1].id, 'Tisch 1', { cls: 'final' })
    : matchHtml('F', null, null, 'Tisch 1', { cls: 'final', disabled: true, note: `Stand jetzt: ${esc(table[0].name)} gegen ${esc(table[1].name)}. Steht nach allen Gruppenspielen fest.` });
  h += '</section>';
  return h;
}
function groupTable() {
  let h = `<table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>Becher</th><th>Pkt</th></tr></thead><tbody>`;
  standings().forEach((r, i) => {
    h += `<tr class="${i < 2 ? 'fin' : ''}"><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.played}</td><td>${r.wins}</td><td>${r.cups}</td><td class="pts">${r.pts}</td></tr>`;
  });
  return h + '</tbody></table>';
}
function viewTabelle() {
  return groupTable() + `<p class="note">Nur Gruppenphase. Rot markiert: ${status(S.final).st === 'done' ? 'Finalisten' : 'aktuell im Finale'}. Bei Punktgleichheit zählen erst die Siege, dann der direkte Vergleich, dann die übrigen Becher.</p>`;
}
function viewEndstand() {
  const f = finalResult();
  if (!f) return `<p class="note">Der Endstand steht nach dem Finale fest. Bis dahin zeigt die Tabelle den Stand der Gruppenphase.</p>`;
  let h = `<div class="champ"><small>Turniersieger</small><strong>${esc(f.win.name)}</strong></div>`;
  h += `<section class="round"><div class="round-head"><h2>Finale</h2></div>
    ${matchHtml('F', f.table[0].id, f.table[1].id, 'Tisch 1', { cls: 'final' })}</section>`;
  h += `<section class="round"><div class="round-head"><h2>Gruppenphase</h2></div>${groupTable()}</section>
    <p class="note">Die Top 2 der Gruppenphase spielen das Finale. Das Finale zählt nicht in die Tabelle.</p>`;
  h += `<div class="share"><button class="btn solid" id="b-shot" data-act="shot">Als Bild teilen</button>
    <img id="shot" class="shot" alt="Endstand als Bild" hidden></div>`;
  return h;
}

/* ---------- Endstand als Bild (1080×1350, zum Teilen per WhatsApp & Co.) ---------- */
let shot = { key: null, blob: null, url: null };
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
// Schriftgröße verkleinern, bis der Text in max Pixel passt
function fitFont(c, text, max, size, font) {
  while (size > 14) { c.font = font(size); if (c.measureText(text).width <= max) break; size -= 2; }
  c.font = font(size);
}
function spacing(c, px) { if ('letterSpacing' in c) c.letterSpacing = px + 'px'; }
function drawBat(c, x, y, s) {
  c.fillStyle = '#05060d'; c.beginPath(); c.moveTo(x, y);
  c.quadraticCurveTo(x - s * .5, y - s * .5, x - s, y - s * .1);
  c.quadraticCurveTo(x - s * .7, y, x - s * .6, y + s * .25);
  c.quadraticCurveTo(x - s * .35, y + s * .05, x, y + s * .3);
  c.quadraticCurveTo(x + s * .35, y + s * .05, x + s * .6, y + s * .25);
  c.quadraticCurveTo(x + s * .7, y, x + s, y - s * .1);
  c.quadraticCurveTo(x + s * .5, y - s * .5, x, y);
  c.fill();
}
function drawTrophy(c, x, y, s) {
  const g = c.createLinearGradient(x - s * .4, 0, x + s * .4, 0);
  g.addColorStop(0, '#f7d36b'); g.addColorStop(.45, '#fff1b8'); g.addColorStop(1, '#d9930f');
  c.strokeStyle = '#f3b53b'; c.lineWidth = s * .07;
  c.beginPath(); c.arc(x - s * .4, y + s * .2, s * .15, Math.PI / 2, Math.PI * 1.5); c.stroke();
  c.beginPath(); c.arc(x + s * .4, y + s * .2, s * .15, -Math.PI / 2, Math.PI / 2); c.stroke();
  c.fillStyle = g; c.beginPath(); c.moveTo(x - s * .4, y); c.lineTo(x + s * .4, y);
  c.quadraticCurveTo(x + s * .4, y + s * .6, x, y + s * .62);
  c.quadraticCurveTo(x - s * .4, y + s * .6, x - s * .4, y); c.fill();
  c.fillRect(x - s * .06, y + s * .6, s * .12, s * .18);
  rrect(c, x - s * .25, y + s * .78, s * .5, s * .12, s * .03); c.fill();
}
function drawShot(c, f) {
  const W = 1080, H = 1350, X = 80;
  const disp = s => `400 ${s}px "Bowlby One", "Arial Black", sans-serif`;
  const body = w => s => `${w} ${s}px Figtree, system-ui, sans-serif`;
  // Nachthimmel, Sterne, Mond, Fledermäuse
  const bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0e1120'); bg.addColorStop(1, '#2a1238');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  let seed = 31; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  c.fillStyle = '#fff';
  for (let i = 0; i < 70; i++) { c.globalAlpha = .2 + rnd() * .6; c.beginPath(); c.arc(rnd() * W, rnd() * 720, 1 + rnd() * 2.2, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  c.save(); c.shadowColor = 'rgba(243,231,196,.6)'; c.shadowBlur = 60; c.fillStyle = '#f3e7c4';
  c.beginPath(); c.arc(910, 150, 78, 0, 7); c.fill(); c.restore();
  c.fillStyle = 'rgba(120,100,60,.15)';
  [[885, 128, 15], [942, 172, 11], [902, 192, 7]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); });
  drawBat(c, 850, 215, 46); drawBat(c, 990, 92, 30); drawBat(c, 760, 118, 22);
  // Titel
  c.textAlign = 'left'; c.fillStyle = '#9ba1ba'; c.font = body(600)(26); spacing(c, 3);
  c.fillText('SA, 31. OKTOBER 2026 · ENDSTAND', X, 110); spacing(c, 0);
  c.font = disp(84); c.fillStyle = '#eef0f8'; c.fillText('Halloween-', X, 205);
  c.fillStyle = '#ff5566'; c.fillText('Bierpong', X, 295);
  const label = (text, y) => { c.textAlign = 'left'; c.fillStyle = '#9ba1ba'; c.font = body(700)(24); spacing(c, 4); c.fillText(text, X, y); spacing(c, 0); };
  // Finale: Sieger links, Zweiter rechts, VS in der Mitte
  label('FINALE', 385);
  const top = 405, ph = 340;
  const cg = c.createLinearGradient(60, top, 525, top + ph); cg.addColorStop(0, '#b81d30'); cg.addColorStop(1, '#ff5566');
  rrect(c, 60, top, 465, ph, 32); c.fillStyle = cg; c.fill();
  rrect(c, 555, top, 465, ph, 32); c.fillStyle = '#211c37'; c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.12)'; c.stroke();
  drawTrophy(c, 292, top + 28, 92);
  c.beginPath(); c.arc(787, top + 70, 40, 0, 7); c.fillStyle = '#c9cedb'; c.fill();
  c.textAlign = 'center'; c.fillStyle = '#171a2c'; c.font = disp(40); c.fillText('2', 787, top + 86);
  [[292, f.win, 'TURNIERSIEGER', f.cups, '#fff', 'rgba(255,255,255,.85)'],
   [787, f.lose, 'PLATZ 2', 0, '#eef0f8', '#9ba1ba']].forEach(([cx, team, tag, cups, ink, soft]) => {
    c.textAlign = 'center'; c.fillStyle = soft; c.font = body(700)(22); spacing(c, 3); c.fillText(tag, cx, top + 160); spacing(c, 0);
    c.fillStyle = ink; fitFont(c, team.name, 410, 44, disp); c.fillText(team.name, cx, top + 214);
    c.font = disp(64); c.fillText(cups, cx, top + 290);
    c.fillStyle = soft; c.font = body(500)(22); c.fillText('Becher übrig', cx, top + 322);
  });
  c.beginPath(); c.arc(540, top + ph / 2, 38, 0, 7); c.fillStyle = '#1a1430'; c.fill();
  c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.25)'; c.stroke();
  c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = disp(26); c.fillText('VS', 540, top + ph / 2 + 10);
  // Gruppenphase: reine Tabelle, das Finale zählt hier nicht mit
  label('GRUPPENPHASE', 815);
  const cols = [[640, 'SP', r => r.played], [770, 'SIEGE', r => r.wins], [890, 'BECHER', r => r.cups]];
  c.fillStyle = '#6b7190'; c.font = body(600)(20); spacing(c, 2);
  c.textAlign = 'center'; c.fillText('#', 100, 862);
  c.textAlign = 'left'; c.fillText('TEAM', 150, 862);
  c.textAlign = 'right'; cols.forEach(([x, l]) => c.fillText(l, x, 862)); c.fillText('PKT', 1000, 862); spacing(c, 0);
  f.table.forEach((r, i) => {
    const y = 880 + i * 64;
    rrect(c, 60, y, 960, 54, 14); c.fillStyle = i % 2 ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.07)'; c.fill();
    c.textAlign = 'center'; c.fillStyle = i < 2 ? '#ff5566' : '#9ba1ba'; c.font = disp(28); c.fillText(i + 1, 100, y + 38);
    c.textAlign = 'left'; c.fillStyle = '#eef0f8'; fitFont(c, r.name, 440, 28, body(600)); c.fillText(r.name, 150, y + 37);
    c.textAlign = 'right'; c.font = body(600)(26); cols.forEach(([x, , g]) => c.fillText(g(r), x, y + 37));
    c.fillStyle = '#ff5566'; c.font = disp(28); c.fillText(r.pts, 1000, y + 38);
  });
  // Fußzeile mit Becher-Dreieck und Ball
  c.textAlign = 'left'; c.fillStyle = '#9ba1ba'; c.font = body(500)(22);
  c.fillText('Die Top 2 der Gruppenphase spielen das Finale', X, 1290);
  [3, 2, 1].forEach((n, j) => {
    for (let k = 0; k < n; k++) {
      const x = 960 - (n - 1) * 13 + k * 26, y = 1262 + j * 23;
      c.beginPath(); c.arc(x, y, 12, 0, 7); c.fillStyle = '#cf2638'; c.fill();
      c.lineWidth = 3; c.strokeStyle = '#f2f3f7'; c.stroke();
      c.beginPath(); c.arc(x, y, 7, 0, 7); c.fillStyle = '#8e1422'; c.fill();
    }
  });
  c.beginPath(); c.arc(1030, 1244, 8, 0, 7); c.fillStyle = '#fff'; c.fill();
}
function fontsReady() {
  if (!document.fonts) return Promise.resolve();
  return Promise.all(['400 40px "Bowlby One"', '500 20px Figtree', '600 20px Figtree', '700 20px Figtree']
    .map(f => document.fonts.load(f))).catch(() => {});
}
// Bild schon beim Öffnen des Tabs erzeugen, damit Teilen direkt im Tipp passiert (iOS verlangt das)
function prepareShot() {
  const f = finalResult(), img = document.getElementById('shot');
  if (!f || !img) return;
  const key = JSON.stringify([f.table, S.final]);
  const show = () => { const i = document.getElementById('shot'); if (i && shot.url) { i.src = shot.url; i.hidden = false; } };
  if (shot.key === key) return show();
  if (shot.url) URL.revokeObjectURL(shot.url);
  shot = { key, blob: null, url: null };
  fontsReady().then(() => {
    const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1350;
    drawShot(cv.getContext('2d'), f);
    cv.toBlob(b => { if (shot.key !== key || !b) return; shot.blob = b; shot.url = URL.createObjectURL(b); show(); }, 'image/png');
  });
}
function shareShot() {
  if (!shot.blob) return;
  const file = new File([shot.blob], 'bierpong-endstand.png', { type: 'image/png' });
  const mobile = matchMedia('(pointer: coarse)').matches;
  if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Halloween-Bierpong Endstand' }).catch(() => {});
    return;
  }
  const a = document.createElement('a'); a.href = shot.url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
function viewSetup() {
  const c = ui.confirm;
  const confirmBox = (kind, text, btn) => c === kind
    ? `<div class="confirm"><p>${text}</p><div class="row"><button class="btn" id="c-no" data-act="cancel">Abbrechen</button><button class="btn solid" id="c-yes-${kind}" data-act="do-${kind}">${btn}</button></div></div>`
    : '';
  return `<div class="panel"><h3>Becher pro Team</h3>
      <div class="seg">${[6, 10].map(n => `<button id="cups-${n}" data-act="cups" data-n="${n}" aria-pressed="${S.cups === n}">${n} Becher</button>`).join('')}</div></div>
    <div class="panel"><h3>Teams</h3>
      ${S.teams.map((n, i) => `<div class="field"><label for="team-${i}">Team ${i + 1}</label><input id="team-${i}" data-team="${i}" value="${esc(n)}"></div>`).join('')}</div>
    <div class="panel"><h3>Spielplan</h3>
      ${c === 'redraw' ? confirmBox('redraw', 'Stellt den festen Spielplan wieder her und löscht alle Ergebnisse.', 'Wiederherstellen')
        : `<button class="btn" id="b-redraw" data-act="ask-redraw">Spielplan wiederherstellen</button>`}
      ${c === 'reset' ? confirmBox('reset', 'Alle Ergebnisse inklusive Finale werden gelöscht. Der Spielplan bleibt.', 'Löschen')
        : `<button class="btn danger" id="b-reset" data-act="ask-reset">Ergebnisse löschen</button>`}
    </div>`;
}

function render() {
  if (!S) return;
  const a = document.activeElement;
  const focusId = a && a.id;
  const typing = a && a.dataset && a.dataset.team != null ? { v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === ui.tab));
  document.getElementById('app').innerHTML = ui.tab === 'spiele' ? viewSpiele() : ui.tab === 'tabelle' ? viewTabelle() : ui.tab === 'endstand' ? viewEndstand() : viewSetup();
  if (ui.tab === 'endstand') prepareShot();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && !el.disabled) {
      el.focus();
      if (typing) { el.value = typing.v; try { el.setSelectionRange(typing.s, typing.e); } catch (e) {} }
    }
  }
}

/* ---------- Speichern: Firebase (live für alle) oder lokal ---------- */
function setSync(state, text) {
  const el = document.getElementById('sync');
  el.className = 'sync ' + state; el.textContent = text;
}
function showError(err) {
  const box = document.getElementById('err');
  const msg = String(err && (err.code || err.message) || err);
  box.textContent = /konnte nicht/.test(msg) ? msg : /permission/i.test(msg)
    ? 'Firebase verweigert den Zugriff. Prüfe die Datenbank-Regeln (Anleitung Schritt 4).'
    : 'Speichern fehlgeschlagen: ' + msg;
  box.hidden = false;
}
function normalize(v) {
  v.scores = v.scores || {};
  Object.keys(v.scores).forEach(k => { const x = v.scores[k] || []; v.scores[k] = [+x[0] || 0, +x[1] || 0]; });
  const f = v.final || []; v.final = [+f[0] || 0, +f[1] || 0];
  v.cups = v.cups === 6 ? 6 : 10;
  v.teams = DEFAULT_TEAMS.map((d, i) => (v.teams && v.teams[i]) || d);
  return v;
}
// paths: Teil-Updates wie {"scores/0-1": [3,0]}; whole=true ersetzt alles (Neu auslosen)
function commit(paths, whole) {
  render();
  if (LOCAL) { save(); return; }
  const p = whole ? dbRef.set(S) : dbRef.update(paths);
  p.then(() => { document.getElementById('err').hidden = true; }).catch(showError);
}

function start() {
  if (LOCAL) {
    S = load(); if (!S || needsMigration(S)) S = fresh(S && S.teams);
    S = normalize(S); save();
    setSync('', 'Nur dieses Gerät');
    if (CONFIGURED) showError('Firebase konnte nicht geladen werden (keine Internetverbindung?). Ergebnisse werden nur auf diesem Gerät gespeichert. Seite neu laden, sobald du online bist.');
    render(); return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  dbRef = db.ref(ROOT);
  if (!LOCKED) dbRef.transaction(cur => cur || fresh()).catch(showError);
  dbRef.on('value', snap => {
    const v = snap.val();
    if (!v || !v.rounds) return;
    if (!LOCKED && needsMigration(v)) {
      dbRef.update({ rounds: fixedRounds(), scheduleId: SCHEDULE_ID, scores: null, final: [0, 0] }).catch(showError);
      return;
    }
    S = normalize(v); render();
  }, showError);
  db.ref('.info/connected').on('value', s => s.val() ? setSync('live', 'Live') : setSync('offline', 'Offline'));
}

document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; ui.confirm = null; render();
});
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !S) return;
  if (b.dataset.act === 'shot') return shareShot();
  if (LOCKED) return;
  const k = b.dataset.k;
  if (k) {
    const act0 = b.dataset.act;
    const setScore = v => { if (k === 'F') S.final = v; else S.scores[k] = v; delete ui.pick[k]; commit({ [k === 'F' ? 'final' : 'scores/' + k]: v }); };
    if (b.dataset.win !== undefined) { ui.pick[k] = +b.dataset.win; return render(); }
    if (b.dataset.cups !== undefined) { const v = [0, 0]; v[ui.pick[k]] = +b.dataset.cups; return setScore(v); }
    if (act0 === 'cancel-pick') { delete ui.pick[k]; return render(); }
    if (act0 === 'clear') return setScore([0, 0]);
    if (act0 === 'edit') { const st = status((k === 'F' ? S.final : S.scores[k]) || [0, 0]); ui.pick[k] = st.w; return render(); }
    return;
  }
  const act = b.dataset.act;
  if (act === 'cups') {
    S.cups = +b.dataset.n;
    Object.values(S.scores).forEach(sc => { sc[0] = Math.min(sc[0], S.cups); sc[1] = Math.min(sc[1], S.cups); });
    S.final = S.final.map(v => Math.min(v, S.cups));
    return commit({ cups: S.cups, scores: S.scores, final: S.final });
  }
  if (act === 'do-redraw') { S = { ...fresh(S.teams), cups: S.cups }; ui.confirm = null; ui.pick = {}; ui.tab = 'spiele'; return commit(null, true); }
  if (act === 'do-reset') { S.scores = {}; S.final = [0, 0]; ui.confirm = null; ui.pick = {}; ui.tab = 'spiele'; return commit({ scores: null, final: [0, 0] }); }
  if (act === 'ask-redraw') ui.confirm = 'redraw';
  if (act === 'ask-reset') ui.confirm = 'reset';
  if (act === 'cancel') ui.confirm = null;
  render();
});
// Teamnamen werden beim Verlassen des Feldes gespeichert
document.getElementById('app').addEventListener('change', e => {
  const i = e.target.dataset.team; if (i == null || !S || LOCKED) return;
  const name = e.target.value.trim() || ('Team ' + (+i + 1));
  S.teams[+i] = name;
  commit({ ['teams/' + i]: name });
});
if (LOCKED) document.getElementById('tab-setup').hidden = true;
start();
</script>
